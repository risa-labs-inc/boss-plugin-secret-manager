// Compose stability configuration.
//
// Declaring these types stable resolves their stability at COMPILE time, so the Compose compiler
// never emits a runtime `getstatic <Type>.$stable` read for them in this module.
//
// Why that matters here: boss-plugin-api ships `ai.rever.boss.plugin.logging` and is a Compose
// project, so its ComponentLogger has a synthetic `$stable` field. The host bundles its own copy of
// that package WITHOUT the field, and the host's copy shadows the api's parent-first inside plugin
// classloaders. Any emitted read therefore links at build time and is missing at load time, which
// makes BinaryCompatibilityValidator reject the whole plugin — that is what made 1.2.6 and 1.2.7
// unloadable on every host.
//
// This is the module-wide defence: it holds no matter where a logger is declared, unlike the
// per-class "keep it off instance properties" discipline. The buildPluginJar bytecode guard stays
// as the backstop that proves it.
//
// Loggers are genuinely stable — a ComponentLogger is an immutable holder of a component name.
ai.rever.boss.plugin.logging.**
