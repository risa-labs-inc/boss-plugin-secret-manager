name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    uses: risa-labs-inc/BossConsole-Releases/.github/workflows/plugin-release.yml@main
    with:
      # Pinned rather than 'latest'. The AI provider code compiles against symbols added in
      # api 1.0.71; the LinkageError guard around registration buys runtime tolerance on an
      # older host, not build tolerance. 'latest' silently required latest >= 1.0.71, so a
      # future api release would surface here as a confusing compile failure instead of an
      # explicit version bump.
      boss_plugin_api_version: '1.0.71'
    secrets:
      BOSS_STORE_PLUGIN_PUBLISH_KEY: ${{ secrets.BOSS_STORE_PLUGIN_PUBLISH_KEY }}
